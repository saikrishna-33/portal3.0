<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Quote Community</title>

    <link rel="stylesheet" href="css/auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="background">

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

</div>



<div class="container">

<div class="left">

<h1>

Welcome Back 👋

</h1>

<p>

Login to continue your journey with Quote Community.

Discover inspiring quotes and connect with people around the world.

</p>

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Login">

</div>



<div class="right">

<form id="loginForm">

<h2>

Login

</h2>

<p>

Sign in to your account

</p>



<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>



<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i
class="fa-solid fa-eye togglePassword"
id="togglePassword">
</i>

</div>



<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>



<button
type="submit"
class="login-btn">

Login

</button>



<div class="divider">

<span>

OR

</span>

</div>



<button
type="button"
class="google-btn">

<img
src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
width="20">

Continue with Google

</button>



<div class="bottom-text">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</div>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script>

const password=document.getElementById("password");

const toggle=document.getElementById("togglePassword");

toggle.onclick=()=>{

if(password.type==="password"){

password.type="text";

toggle.classList.remove("fa-eye");

toggle.classList.add("fa-eye-slash");

}else{

password.type="password";

toggle.classList.remove("fa-eye-slash");

toggle.classList.add("fa-eye");

}

}

</script>

</body>

</html>
